[package]
name = "space-lens"
version = "0.4.0"
edition = "2021"
description = "A local-first macOS disk space explorer"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
trash = "5.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

